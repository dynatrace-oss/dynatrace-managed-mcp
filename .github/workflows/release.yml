name: Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # e.g. owner/repo (must be lowercase for Docker)

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js # will read version from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run prettier
        run: npm run prettier

      - name: Run tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  extract-info:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch full history for changelog generation

      - name: Extract version from tag
        id: version
        run: |
          # Remove 'v' prefix from tag to get version
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog for GitHub Release
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Take everything between the '## <version>' heading and the next '## ' heading
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > changelog_section.md

          # Fail before publishing if CHANGELOG.md has no section for this version
          if [ ! -s changelog_section.md ]; then
            echo "::error file=CHANGELOG.md::No '## $VERSION' section found - rename the 'Unreleased' heading to '$VERSION' before tagging."
            exit 1
          fi

          # Files are not shared between jobs, so hand the section to the
          # release job as a multi-line job output instead.
          DELIMITER="CHANGELOG_EOF_$(openssl rand -hex 16)"
          {
            echo "changelog<<$DELIMITER"
            cat changelog_section.md
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

  publish-npm:
    runs-on: ubuntu-latest
    needs: [test, extract-info]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js # will read version from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org' # writes the .npmrc that consumes NODE_AUTH_TOKEN

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build # package.json publishes "files": ["dist"], so dist/ must exist here

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          VERSION: ${{ needs.extract-info.outputs.version }}
        run: |
          # Publish to npm with provenance
          if [[ "$VERSION" == *"-"* ]]; then
            # Pre-release version - publish with next tag
            npm publish --tag next --provenance --access public
          else
            # Stable release - publish with latest tag
            npm publish --provenance --access public
          fi

  github-release:
    runs-on: ubuntu-latest
    needs: [extract-info, publish-npm]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.extract-info.outputs.tag }}
          VERSION: ${{ needs.extract-info.outputs.version }}
          CHANGELOG: ${{ needs.extract-info.outputs.changelog }}
        run: |
          # Create release body from the CHANGELOG.md section extracted in extract-info
          {
            echo "## Changes in $TAG"
            echo
            printf '%s\n' "$CHANGELOG"
            echo
            echo "## Usage"
            echo
            echo '```bash'
            echo "npx -y @dynatrace-oss/dynatrace-managed-mcp-server@$VERSION"
            echo '```'
          } > release_body.md

          # Create the release
          if [[ "$VERSION" == *"-"* ]]; then
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes-file release_body.md \
              --prerelease
          else
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes-file release_body.md
          fi

  publish-docker:
    runs-on: ubuntu-latest
    needs: [test, extract-info]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.extract-info.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        id: ghcrpush
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign ghcr image
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.ghcrpush.outputs.digest }}"

  publish-mcp-registry:
    runs-on: ubuntu-latest
    needs: publish-npm # the registry validates that the npm package version exists
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code # mcp-publisher reads server.json from the working directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # From https://github.com/modelcontextprotocol/registry/blob/main/docs/guides/publishing/github-actions.md
      - name: Install MCP Publisher
        run: |
          curl --proto "=https" -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      # Login to GitHub - apparently this works out of the box with GH Workflows
      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      # Publish the package to the MCP Registry
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
