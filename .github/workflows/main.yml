name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js # will read version from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prettier
        run: npm run prettier

      - name: Check manifest version sync
        run: npm run version:check

      - name: Run tests with coverage
        run: npm run test:unit -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/

      - name: Build
        run: npm run build

      - name: Smoke test
        run: node dist/index.js --help

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install server dependencies
        run: npm ci --ignore-scripts

      - name: Install extension dependencies
        run: npm ci --ignore-scripts
        working-directory: extensions/vscode

      - name: Typecheck extension
        run: npm run typecheck
        working-directory: extensions/vscode

      - name: Package extension
        run: npm run package
        working-directory: extensions/vscode

      - name: Smoke test the bundled server
        run: node extensions/vscode/dist/mcp/server.js --help
        env:
          LOG_OUTPUT: stderr-all

      - name: Upload extension package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: extensions/vscode/*.vsix
