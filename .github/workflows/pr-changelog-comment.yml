name: PR Changelog Comment

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment-on-missing-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md changes
        id: changelog-changes
        run: |
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          HEAD_BRANCH="${{ github.event.pull_request.head.sha }}"

          git diff origin/${BASE_BRANCH}...${HEAD_BRANCH} -- CHANGELOG.md > changelog_diff.txt

          if [ -s changelog_diff.txt ]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: steps.changelog-changes.outputs.changes_detected == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 📋 CHANGELOG.md Not Updated\n\nThis PR does not modify \`CHANGELOG.md\`. If your changes are user-facing, please add an entry under the \`## Unreleased changes\` section.\n\n---\n_This comment was automatically generated by the PR Changelog Comment workflow._`
            });
